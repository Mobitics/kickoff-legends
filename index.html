<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kickoff Legends</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: one floodlit column of scoreboard-style menus; matches take over the whole screen */
:root{
  --night:#07120d; --panel:#0e2318; --panel-2:#143022; --chalk:#eef3ea; --muted:#94ad9b;
  --flood:#ffd23f; --line:rgba(238,243,234,.13); --good:#4ade80; --bad:#f87171;
  --display:'Saira Condensed','Arial Narrow',Impact,sans-serif; --body:'Barlow',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night) radial-gradient(ellipse 90% 45% at 50% -8%,rgba(255,226,120,.14),transparent 70%) no-repeat;color:var(--chalk);font-family:var(--body);font-size:16px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--flood);outline-offset:2px}
#screen{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:34px;line-height:1}
h3{font-size:20px;color:var(--muted);letter-spacing:.08em}
p{margin:0;line-height:1.45}
.muted{color:var(--muted)}
.brand{position:relative;padding:34px 0 16px;text-align:left}
.brand h1{font-size:68px;line-height:.86;font-weight:800}
.brand h1 span{color:var(--flood)}
.brand .lines{position:absolute;right:-30px;top:6px;width:170px;height:170px;border:2px solid var(--line);border-radius:50%;pointer-events:none}
.brand .lines::after{content:"";position:absolute;left:50%;top:-40px;bottom:-40px;border-left:2px solid var(--line)}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:14px;color:var(--flood)}
.menu{display:flex;flex-direction:column;gap:10px}
.big{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:6px;transition:border-color .15s,transform .1s,background .15s}
.big:hover{border-color:var(--flood);background:var(--panel-2)}
.big:active{transform:scale(.985)}
.big b{font-family:var(--display);font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.big small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.big .chev{font-family:var(--display);font-size:30px;color:var(--flood)}
.big.primary{background:var(--flood);color:#1a1503;border-color:var(--flood)}
.big.primary small{color:#4d4210}.big.primary .chev{color:#1a1503}
.big.ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:11px 16px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.btn:hover{border-color:var(--flood)}
.btn.y{background:var(--flood);color:#1a1503;border-color:var(--flood)}
.btn.sm{padding:7px 11px;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:none;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-weight:600;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.club{display:flex;align-items:center;gap:10px;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);text-align:left;min-width:0}
.club:hover{border-color:var(--flood)}
.club .nm{font-weight:600;font-size:14px;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.club .ov{margin-left:auto;font-family:var(--display);font-size:20px;color:var(--flood)}
.kitdot{width:22px;height:22px;border-radius:50%;flex:none;border:3px solid;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.sq{display:flex;flex-direction:column;gap:4px}
.pl{display:grid;grid-template-columns:42px 34px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%;font-variant-numeric:tabular-nums}
.pl .slot{font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--muted)}
.pl .pos{font-family:var(--display);font-size:13px;padding:2px 0;border-radius:3px;text-align:center;font-weight:700}
.pos.GK{background:#f59e0b;color:#1b1203}.pos.DEF{background:#3b82f6;color:#06122b}.pos.MID{background:#22c55e;color:#052410}.pos.FWD{background:#ef4444;color:#2a0505}
.pl .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .nm small{color:var(--muted);margin-left:4px}
.pl .ov{font-family:var(--display);font-size:20px;font-weight:700}
.pl.sel{border-color:var(--flood);background:#2a2a0f}
.pl.off .slot{color:var(--bad)}
.pl.chk{border-color:var(--good);background:#0f3320}
.divider{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:14px;margin-top:8px}
.hint{font-size:14px;color:var(--muted)}
.banner{padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);font-weight:500}
.banner.good{border-color:rgba(74,222,128,.5)}.banner.bad{border-color:rgba(248,113,113,.5)}
input[type=text]{width:100%;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:#091a11;color:var(--chalk);font:inherit;font-size:18px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-size:20px;text-transform:uppercase}
.seg button.on{background:var(--flood);color:#1a1503;border-color:var(--flood)}
.kits{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.kit{display:flex;flex-direction:column;gap:8px}
.kit svg{width:80px;height:80px;align-self:center}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.sw button.on{border-color:var(--flood);box-shadow:0 0 0 2px var(--flood)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--panel-2);border-radius:6px;padding:10px 4px}
.stats b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
/* player card */
.card{position:relative;width:min(280px,100%);aspect-ratio:5/7;align-self:center;border-radius:18px 18px 40px 40px;padding:22px 20px;color:#20180a;background:linear-gradient(160deg,#ffe58a 0%,#e8b93a 45%,#b9851c 100%);box-shadow:0 18px 50px rgba(255,200,60,.18),inset 0 0 0 3px rgba(255,255,255,.35);display:flex;flex-direction:column;overflow:hidden}
.card.silver{background:linear-gradient(160deg,#f3f5f7,#b9c0c8 55%,#858d96);box-shadow:0 18px 50px rgba(200,210,220,.14),inset 0 0 0 3px rgba(255,255,255,.4)}
.card.bronze{background:linear-gradient(160deg,#e7b38a,#b97a4b 55%,#7d4e2c)}
.card.icon{background:linear-gradient(160deg,#fff6d0 0%,#ffd23f 30%,#e0a10b 60%,#7a4b00 100%);box-shadow:0 0 0 2px #fff3b0,0 0 40px rgba(255,210,63,.55),inset 0 0 0 3px rgba(255,255,255,.55)}
.card.icon::after{content:"MAX";position:absolute;right:16px;bottom:18px;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.12em;color:#5a3a00;opacity:.7}
.card .ovr{font-family:var(--display);font-size:64px;font-weight:800;line-height:.85}
.card .cpos{font-family:var(--display);font-size:24px;font-weight:700}
.card .face{position:absolute;right:16px;top:30px;width:120px;height:120px}
.card .cname{margin-top:auto;font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;text-align:center;border-bottom:2px solid rgba(0,0,0,.25);padding-bottom:4px;line-height:1;overflow-wrap:anywhere}
.card .cclub{text-align:center;font-weight:600;font-size:13px;margin:4px 0 8px}
.card .cst{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.card .cst span b{font-weight:800;margin-right:6px}
.rating{font-family:var(--display);font-size:80px;font-weight:800;line-height:.9;color:var(--flood)}
.score{font-family:var(--display);font-size:56px;font-weight:800;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.vs{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:600;text-align:center}
.vs span{flex:1;min-width:0;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line)}
/* ---------- match ---------- */
#match{position:fixed;inset:0;z-index:20;background:#06100a;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#hud{position:absolute;left:0;right:0;top:0;height:calc(54px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;background:#030a06;border-bottom:1px solid var(--line);z-index:2}
#hud .tm{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase}
#hud .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hud .tm.b{justify-content:flex-end}
#hud .sc{text-align:center;background:#111;border:1px solid #2a2a2a;border-radius:4px;padding:2px 12px;min-width:92px}
#hud .sc b{display:block;font-family:var(--display);font-size:26px;line-height:1;color:var(--flood);font-variant-numeric:tabular-nums}
#hud .sc small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#hud .kd{width:14px;height:14px;border-radius:3px;flex:none;border:2px solid}
#hud .hb{background:#111;border:1px solid #333;border-radius:6px;padding:6px 10px;font-weight:700;font-size:14px}
#cv,#gl{position:absolute;left:0;right:0;bottom:0;top:calc(54px + env(safe-area-inset-top,0px));width:100%;height:calc(100% - 54px - env(safe-area-inset-top,0px));display:block}
#cv{z-index:1}
#ctrls{position:absolute;left:0;right:0;bottom:0;height:0;z-index:2}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.4)}
#btns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto auto;gap:9px;align-items:end;justify-items:center}
#btns button{border-radius:50%;border:2px solid rgba(255,255,255,.35);font-family:var(--display);text-transform:uppercase;font-size:15px;font-weight:700;touch-action:none;display:flex;align-items:center;justify-content:center}
#bShoot{width:84px;height:84px;background:rgba(255,210,63,.85);color:#1a1503;grid-column:2;grid-row:2/4}
#bSteal{width:56px;height:56px;background:rgba(34,197,94,.75);grid-column:2;grid-row:1}
#bBody{width:56px;height:56px;background:rgba(239,68,68,.75);grid-column:1;grid-row:1}
#bFlick{width:50px;height:50px;background:rgba(168,85,247,.8);grid-column:1/3;grid-row:1;justify-self:center;align-self:start;transform:translateY(-58px)}
#btns button.skill{background:rgba(168,85,247,.8)}
#btns button.dim{opacity:.35}
#bPass{width:64px;height:64px;background:rgba(59,130,246,.75);grid-column:1;grid-row:3}
#bSprint{width:58px;height:58px;background:rgba(255,255,255,.18);grid-column:1;grid-row:2}
#keys{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;color:rgba(238,243,234,.55);white-space:nowrap;z-index:2;pointer-events:none}
@media (pointer:coarse),(max-width:760px){#keys{display:none}}
@media (max-height:420px){#joy{width:104px;height:104px}#bShoot{width:72px;height:72px}#bPass{width:56px;height:56px}#bSprint{width:48px;height:48px}#bSteal,#bBody{width:46px;height:46px;font-size:13px}#btns{gap:6px}}
#ov{position:absolute;inset:0;z-index:5;background:rgba(3,10,6,.82);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
#ov .box{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
#ov ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.mc{position:relative;aspect-ratio:5/7;max-width:100%;min-width:0;border:0;border-radius:10px 10px 24px 24px;padding:8px 8px 10px;display:flex;flex-direction:column;text-align:left;color:#22190a;overflow:hidden;
  background:linear-gradient(160deg,#ffe58a 0%,#e8b93a 48%,#b9851c 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.35);transition:transform .12s}
.mc.silver{background:linear-gradient(160deg,#f3f5f7,#b9c0c8 55%,#858d96)}
.mc.bronze{background:linear-gradient(160deg,#e7b38a,#b97a4b 55%,#7d4e2c)}
.mc.elite{background:linear-gradient(160deg,#2a2150 0%,#14102e 55%,#06040f 100%);color:#ffe58a;box-shadow:inset 0 0 0 2px #e8b93a,0 6px 18px rgba(232,185,58,.25)}
.mc:hover{transform:translateY(-2px)}
.mc.sel{outline:3px solid var(--flood);outline-offset:3px;transform:translateY(-4px) scale(1.03)}
.mc .o{font-family:var(--display);font-size:28px;font-weight:800;line-height:.85;font-variant-numeric:tabular-nums}
.mc .p{font-family:var(--display);font-size:14px;font-weight:700;line-height:1.1}
.mc .st{font-size:10px;letter-spacing:-.5px;line-height:1.2}
.mc svg{position:absolute;right:6px;top:14px;width:42%;height:auto}
.mc .n,.mc .c,.mc .s{position:relative;z-index:1}
.mc .sl{position:absolute;left:50%;top:-1px;transform:translateX(-50%);background:#111;color:#eef3ea;font-family:var(--display);font-size:11px;letter-spacing:.06em;padding:1px 7px 2px;border-radius:0 0 6px 6px}
.mc.off .sl{background:#b91c1c}
.mc .n{margin-top:auto;padding-top:2px;font-family:var(--display);font-size:15px;font-weight:800;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(0,0,0,.25);line-height:1.1;padding-bottom:1px}
.mc.elite .n{border-color:rgba(232,185,58,.4)}
.mc .c{font-size:9.5px;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 3px;opacity:.85}
.mc .s{display:grid;grid-template-columns:1fr 1fr;gap:0 6px;font-family:var(--display);font-size:12px;line-height:1.2;font-variant-numeric:tabular-nums}
.mc .s b{font-weight:800;margin-right:3px}
.viewtog{display:flex;gap:4px}.viewtog button{padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600}.viewtog button.on{background:var(--flood);color:#1a1503;border-color:var(--flood)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="screen"></div>

<div id="match" hidden>
  <div id="hud">
    <div class="tm a"><i class="kd" id="kA"></i><span id="hA"></span></div>
    <div class="sc"><b id="hS">0 - 0</b><small id="hT">0'</small></div>
    <div class="tm b"><span id="hB"></span><i class="kd" id="kB"></i></div>
    <button class="hb" id="speedBtn" hidden>1x</button>
    <button class="hb" id="skipBtn" hidden>Skip ›</button>
    <button class="hb" id="pauseBtn" aria-label="Pause">II</button>
  </div>
  <canvas id="gl" hidden></canvas>
  <canvas id="cv"></canvas>
  <div id="ctrls">
    <div id="joy"><div id="knob"></div></div>
    <div id="btns">
      <button id="bFlick" hidden>Flick</button>
      <button id="bBody">Body</button>
      <button id="bSteal">Steal</button>
      <button id="bSprint">Run</button>
      <button id="bPass">Pass</button>
      <button id="bShoot">Shoot</button>
    </div>
  </div>
  <div id="keys">Move: arrows / WASD · Shoot: hold Space · Pass / switch: X · Sprint: Shift</div>
  <div id="ov" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= helpers =================
const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function hexRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function cdist(a,b){const x=hexRgb(a),y=hexRgb(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])}
function lum(h){const [r,g,b]=hexRgb(h);return (0.299*r+0.587*g+0.114*b)/255}
const inkOn=h=>lum(h)>0.6?'#111':'#fff';
const lastName=n=>String(n).trim().split(/\s+/).slice(-1)[0];
const shortOf=n=>{const w=String(n).trim().split(/\s+/).filter(Boolean);return (w.length>1?w.map(x=>x[0]).join(''):w[0]||'YOU').slice(0,3).toUpperCase()};

const FIRST=['Leo','Mateo','Kai','Noah','Luca','Rafa','Theo','Diego','Jonas','Malik','Yuki','Andre','Sami','Felix','Omar','Marco','Ivan','Tomas','Eli','Bruno','Hugo','Nico','Ade','Jules','Remy','Pablo','Kofi','Emil','Dario','Finn','Aron','Tiago','Zane','Caleb','Milo','Rio','Ismael','Viktor','Joao','Sven'];
const LAST=['Silva','Moreau','Kovac','Okafor','Berg','Rossi','Navarro','Fischer','Mensah','Larsen','Duarte','Haddad','Novak','Costa','Petit','Jansen','Romero','Weber','Diallo','Marsh','Ortega','Lindqvist','Sato','Brandt','Vidal','Keane','Abara','Holm','Ferreira','Quinn','Laurent','Nakamura','Osei','Varga','Blanco','Rey','Achterberg','Doyle','Mbeki','Castillo'];

function cl(name,short,ovr,h,a){return {name,short,ovr,home:{shirt:h[0],shorts:h[1]},away:{shirt:a[0],shorts:a[1]}}}
const CLUBS=[
 cl('Real Madrid','RMA',88,['#f4f4f4','#f4f4f4'],['#24224a','#24224a']),
 cl('Manchester City','MCI',88,['#6cabdd','#ffffff'],['#1c2340','#1c2340']),
 cl('Barcelona','BAR',87,['#a50044','#004d98'],['#f2c14e','#f2c14e']),
 cl('Bayern Munich','BAY',87,['#dc052d','#dc052d'],['#f4f4f4','#f4f4f4']),
 cl('Liverpool','LIV',87,['#c8102e','#c8102e'],['#f4f4f4','#1d1d1d']),

function pickKits(aH,aA,bH,bA){let a=aH,b=bH;if(cdist(a.shirt,b.shirt)<130){b=bA;if(cdist(a.shirt,b.shirt)<130)a=aA}return {a,b}}
function lineupFor(sq,n){
  if(n===11)return sq.slice(0,11);
  const out=sq.slice(0,11).filter(p=>p.pos!=='GK').sort((a,b)=>(b.ovr+(b.pos==='FWD'?3:0))-(a.ovr+(a.pos==='FWD'?3:0)));
  return n===1?[out[0]]:[out[1],out[0]];
}
function launchQuick(mode,club,sideKey='my'){
  const me=sideOf(sideKey);const oppSq=clubSquad(club);

  if(mode==='pens'){

    startPens({my:{name:me.name,short:me.short,kit:k.a,shooters:sh(me.squad),gk:me.squad[0]},opp:{name:club.name,short:club.short,kit:k.b,shooters:sh(oppSq),gk:oppSq[0]},
      onEnd:()=>chooseOpp('pens',sideKey),again:()=>launchQuick('pens',club,sideKey)});

  }
  const n=+mode;
  startMatch({n,teamA:{name:me.name,short:me.short,kit:k.a,players:lineupFor(me.squad,n)},teamB:{name:club.name,short:club.short,kit:k.b,players:lineupFor(oppSq,n)},
    control:'team',duration:n===11?180:n===2?120:90,onEnd:()=>chooseOpp(mode,sideKey),onQuit:()=>chooseOpp(mode,sideKey),again:()=>launchQuick(mode,club,sideKey)});
}

    onEnd:res=>careerReport(res,opp),onQuit:careerHub});

function rateCareer(st,res){
  const [a,b]=res.score;

  if(st.passes+st.shots+st.tackles+st.goals===0)r-=1.2;
  return clamp(Math.round(r*10)/10,3,10);
}
function careerReport(res,opp){
  const c=S.career,me=res.ps.find(p=>p.career),st=me.st;
  const rating=rateCareer(st,res);
  let d=rating>=8.5?3:rating>=7?2:rating>=6?1:rating>=5?0:rating>=4?-1:-2;

  c.log.push({vs:opp.name,score:res.score.join('-'),rating,d});if(c.log.length>30)c.log.shift();
  let scout='';

    const band=rating>=8.5?3:rating>=7?2:rating>=5.5?1:0;
    if(band===0)scout='A scout was watching today but left without making an offer.';
    else if(band>c.tier){const list=CLUBS.filter(x=>tierOfClub(x)===band);const cl2=pick(list);c.offer=cl2.name;scout=`A scout from ${cl2.name} was in the crowd and liked what they saw!`;}
    else scout='A scout from a club at your level watched, but a move would not be a step up.';
  }
  if(OWNER&&realMadridScout(c))scout=c.news;
  c.news=scout;save();

// Quick simulation: goals drawn from each side's strength; scorers weighted toward attackers.
function poisson(l){let k=0,p=Math.exp(-l),s=p,u=Math.random();while(u>s&&k<9){k++;p*=l/k;s+=p}return k}
function simScore(sqA,sqB){const d=teamOvr(sqA)-teamOvr(sqB);return [poisson(clamp(1.45*Math.exp(d*0.07),0.25,4.5)),poisson(clamp(1.3*Math.exp(-d*0.07),0.25,4.5))]}
function pickScorer(sq){const xi=sq.slice(0,11).filter(p=>p.pos!=='GK');const w=xi.map(p=>({FWD:6,MID:3,DEF:1}[p.pos]||1)*Math.pow(1.06,p.ovr-70));let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<xi.length;i++){r-=w[i];if(r<=0)return xi[i]}return xi[0]}
function mgrSimOne(){
  const m=S.mgr,fx=fixtures(),opp=fx[m.fx%fx.length];const [a,b]=simScore(m.squad,otherSquad(opp.name));
  const sc=[];for(let i=0;i<a;i++)sc.push(lastName(pickScorer(m.squad).name));
  return mgrRecord(a,b,opp,sc);
}
function mgrSimSeason(){
  const m=S.mgr,startSeason=m.season,rows=[];
  while(m.season===startSeason){const opp=fixtures()[m.fx];const r=mgrSimOne();rows.push(r)}

  <button class="big primary" data-a="hub"><span><b>Continue</b></span><span class="chev">›</span></button>`,()=>mgrHub());
}
function mgrRecord(a,b,opp,sc=[]){
  const m=S.mgr,fx=fixtures();{
      m.gf+=a;m.ga+=b;let prize;
      if(a>b){m.w++;prize=3}else if(a===b){m.d++;prize=1.5}else{m.l++;prize=0.5}
      m.budget=Math.round((m.budget+prize)*10)/10;m.fx++;
      m.last=`${a>b?'Won':a===b?'Drew':'Lost'} ${a}-${b} vs ${opp.name}${sc.length?' ('+sc.map(esc).join(', ')+')':''}. Prize money ${money(prize)}.`;
      if(m.fx>=fx.length){m.last+=` Season ${m.season} finished with ${m.w*3+m.d} points (${m.w}W ${m.d}D ${m.l}L). New season starts now.`;m.season++;m.fx=0;m.w=m.d=m.l=m.gf=m.ga=0;m.squad.forEach(p=>{p.age++;});}
  }
  return {a,b,opp:opp.name,sc};
}

function mgrTrade(name){
  const m=S.mgr,theirs=otherSquad(name);let get=new Set(),give=new Set(),cash=0,msg='',msgCls='';
  const sum=(sq,set)=>sq.filter(p=>set.has(p.id)).reduce((a,p)=>a+value(p),0);
  const row=(p,set,pre)=>`<button class="pl ${set.has(p.id)?'chk':''}" data-a="${pre}:${p.id}"><span class="slot">${set.has(p.id)?'✓':''}</span><span class="pos ${p.pos}">${p.pos}</span><span class="nm">${esc(p.name)}<small>${money(value(p))} · ${p.age}y</small></span><span class="ov">${p.ovr}</span></button>`;
  const r=()=>{

    show(`${topBar('Trade','clubs')}<p class="muted">With ${esc(name)} · Your budget ${money(m.budget)}</p>
    <div class="panel"><div class="row" style="justify-content:space-between"><span>You get <b>${money(vg)}</b></span><span>You give <b>${money(vo)}</b></span></div>
     <div class="row"><span class="hint">Add cash</span><button class="btn sm" data-a="c-5">−5</button><button class="btn sm" data-a="c-1">−1</button><b style="min-width:60px;text-align:center">${money(cash)}</b><button class="btn sm" data-a="c1">+1</button><button class="btn sm" data-a="c5">+5</button></div>
     <button class="btn y" data-a="propose">Propose trade</button>${msg?`<div class="banner ${msgCls}">${msg}</div>`:''}</div>
    <div class="divider">${esc(name)} players · tap to request</div><div class="sq">${[...theirs].sort((a,b)=>b.ovr-a.ovr).map(p=>row(p,get,'g')).join('')}</div>
    <div class="divider">Your players · tap to offer</div><div class="sq">${[...m.squad].sort((a,b)=>b.ovr-a.ovr).map(p=>row(p,give,'o')).join('')}</div>`,
    a=>{
      if(a==='back')return mgrHub();if(a==='clubs')return mgrTradeClub();
      if(a[0]==='c'&&a!=='clubs'){cash=clamp(cash+(+a.slice(1)),0,Math.floor(m.budget));msg='';return r()}
      if(a.startsWith('g:')){const id=a.slice(2);get.has(id)?get.delete(id):get.add(id);msg='';return r()}
      if(a.startsWith('o:')){const id=a.slice(2);give.has(id)?give.delete(id):give.add(id);msg='';return r()}
      if(a==='propose'){const res=aiDecide(theirs,m.squad,get,give,cash);msg=res.msg;msgCls=res.ok?'good':'bad';
        if(res.ok){applyTrade(name,theirs,get,give,cash);get=new Set();give=new Set();cash=0}r()}
    });
  };
  r();
}
function aiDecide(theirs,mine,get,give,cash){
  const G=theirs.filter(p=>get.has(p.id)),O=mine.filter(p=>give.has(p.id));
  if(!G.length)return {ok:false,msg:'Pick at least one of their players to ask for.'};
  if(cash>S.mgr.budget)return {ok:false,msg:'You do not have that much budget.'};
  const ta=theirs.length-G.length+O.length,ma=mine.length-O.length+G.length;
  if(ta<14)return {ok:false,msg:'They would not have enough players left. Offer players back.'};
  if(ta>26)return {ok:false,msg:'Their squad would be too big. Offer fewer players and more cash.'};
  if(ma<14)return {ok:false,msg:'You would not have enough players left.'};
  if(ma>26)return {ok:false,msg:'Your squad would be too big (max 26).'};
  const gk=sq=>sq.filter(p=>p.pos==='GK').length;
  if(gk(theirs)-G.filter(p=>p.pos==='GK').length+O.filter(p=>p.pos==='GK').length<1)return {ok:false,msg:'They will not give up their only goalkeeper.'};
  if(gk(mine)-O.filter(p=>p.pos==='GK').length+G.filter(p=>p.pos==='GK').length<1)return {ok:false,msg:'You need to keep at least one goalkeeper.'};
  const vg=G.reduce((a,p)=>a+value(p),0);
  const top3=[...theirs].sort((a,b)=>b.ovr-a.ovr).slice(0,3).map(p=>p.id);
  let demand=1.05;if(G.some(p=>top3.includes(p.id)))demand+=0.2;
  const ov=O.map(value).sort((a,b)=>b-a).reduce((a,v,i)=>a+v*Math.pow(0.8,i),0)+cash;
  if(ov>=vg*demand){return {ok:true,msg:`Deal done! ${G.map(p=>p.name).join(', ')} joined your club.`}}
  const need=vg*demand-ov;
  return {ok:false,msg:`${need<vg*0.15?'Close, but no.':'Rejected.'} They want about ${money(Math.max(0.5,need))} more value${G.some(p=>top3.includes(p.id))?' because that is one of their stars':''}.`};
}
function applyTrade(name,theirs,get,give,cash){
  const m=S.mgr,G=theirs.filter(p=>get.has(p.id)),O=m.squad.filter(p=>give.has(p.id));
  const inc=[...G];const out=[];
  for(const p of m.squad){if(give.has(p.id)){out.push(inc.length?inc.shift():null)}else out.push(p)}
  let nsq=out.concat(inc);
  // fill empty starting spots with best bench player for that slot
  for(let i=0;i<11;i++)if(!nsq[i]){let bi=-1,bo=-1;for(let j=11;j<nsq.length;j++){const q=nsq[j];if(!q)continue;const sc=q.ovr+(q.pos===SLOTS[i]?20:0);if(sc>bo){bo=sc;bi=j}}if(bi>=0){nsq[i]=nsq[bi];nsq[bi]=null}}
  m.squad=nsq.filter(Boolean);
  const t2=theirs.filter(p=>!get.has(p.id)).concat(O);m.others[name]=autoBest(t2);
  m.budget=Math.round((m.budget-cash)*10)/10;
  m.log.push(`Got ${G.map(p=>esc(lastName(p.name))).join(', ')} from ${esc(name)} for ${[...O.map(p=>esc(lastName(p.name))),cash?money(cash):''].filter(Boolean).join(' + ')||'nothing'}`);
  save();
}

function startSlide(p,dx,dy){
  const d=Math.hypot(dx,dy);if(d<0.01){dx=p.face.x;dy=p.face.y}else{dx/=d;dy/=d}
  const sp=p.spd*2.5;p.sv={x:dx*sp,y:dy*sp};p.slide=24;p.fouled=false;p.face={x:dx,y:dy};p.cd=40;M.charge=0;
  if(M.ball.owner===p){M.ball.owner=null}
}
function slideStep(p){
  const b=M.ball;p.vx=p.sv.x;p.vy=p.sv.y;p.sv.x*=0.93;p.sv.y*=0.93;
  if(--p.slide<=0){p.down=22;return}
  const reach=p.rad+7;
  if(b.owner&&b.owner.team!==p.team){
    const car=b.owner;
    if(car.sk>0&&car.skT==='spin'){}
    else if(dist(p,b)<reach){
      if(Math.random()<0.78+(p.r-car.r)*0.01){car.st.lost++;p.st.tackles++;car.cd=40;car.down=12;b.owner=null;b.passer=null;b.passTarget=null;b.vx=p.sv.x*0.9+rand(-1,1);b.vy=p.sv.y*0.9+rand(-1,1);b.lastKicker=p;pop(p,'SLIDE TACKLE!','#ffd23f');p.slide=Math.min(p.slide,4)}
      else if(!p.fouled){foul(p,car)}
    }else if(dist(p,car)<p.rad+car.rad&&!p.fouled)foul(p,car);
  }else if(!b.owner&&dist(p,b)<reach){b.vx=p.sv.x*0.9;b.vy=p.sv.y*0.9;b.lastKicker=p;b.passer=null;b.passTarget=null}
}
// ---- skill moves ----
const SKILL_NAME={step:'STEPOVER',spin:'ROULETTE',flick:'RAINBOW FLICK'};
function doSkill(p,type,v){
  const b=M.ball;if(b.owner!==p||p.sk>0)return;
  let dx=v&&Math.hypot(v.x,v.y)>0.2?v.x:p.face.x,dy=v&&Math.hypot(v.x,v.y)>0.2?v.y:p.face.y;const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;
  const [near,nd]=nearestOpp(p);
  const ok=Math.random()<0.3+p.sm*0.13+(nd>50?0.15:0);
  p.skT=type;p.sk=type==='spin'?22:type==='step'?16:12;p.skDir={x:dx,y:dy};p.skOk=ok;p.skStart=p.sk;M.charge=0;
  if(type==='spin'&&near){const ax=near.x-p.x,ay=near.y-p.y;const side=(ax*dy-ay*dx)>0?-1:1;p.skDir={x:dx*0.75-dy*side*0.66,y:dy*0.75+dx*side*0.66}}
  if(type==='flick'){
    if(ok){b.owner=null;b.passer=null;b.passTarget=p;b.vx=dx*4.6;b.vy=dy*4.6;b.z=1;b.vz=4.4;b.lastKicker=p;p.cd=10}
    else{b.owner=null;b.vx=dx*1.5;b.vy=dy*1.5;b.z=1;b.vz=1.5;b.lastKicker=p;p.cd=14}
  }
  pop(p,ok?SKILL_NAME[type]+'!':'MESSED UP',ok?'#c084fc':'#9ca3af');
  if(ok&&type==='step')for(const q of M.ps)if(q.team!==p.team&&q.role!=='GK'&&dist(q,p)<75){q.fool=26;q.vx=-dx*1.6+rand(-1,1);q.vy=-dy*1.6+rand(-1,1)}
}
function skillStep(p){
  const b=M.ball,t=p.sk--,prog=1-t/p.skStart,d=p.skDir;
  if(p.skT==='step'){const sway=Math.sin(prog*Math.PI*3)*1.4;p.vx=-d.y*sway*0.6+d.x*0.3;p.vy=d.x*sway*0.6+d.y*0.3;
    if(p.sk===0){if(p.skOk){p.vx=d.x*p.spd*1.6;p.vy=d.y*p.spd*1.6}else if(b.owner===p){b.owner=null;b.vx=d.x*2.2+rand(-1,1);b.vy=d.y*2.2+rand(-1,1);p.cd=25}}}
  else if(p.skT==='spin'){const sp=p.spd*(p.skOk?1.05:0.5);p.vx=d.x*sp;p.vy=d.y*sp;
    if(!p.skOk&&p.sk===8&&b.owner===p){b.owner=null;b.vx=d.x*1.5;b.vy=d.y*1.5;p.cd=25}}
  else if(p.skT==='flick'){p.vx=d.x*p.spd*(prog<0.5?0.3:1.1);p.vy=d.y*p.spd*(prog<0.5?0.3:1.1)}
}
function foul(p,car){
  p.fouled=true;p.st.fouls++;car.down=20;p.slide=Math.min(p.slide,3);
  pop(car,'FOUL!','#f87171');M.msg='FOUL!';M.msgT=50;
  // free kick: fouled team keeps the ball and the slider's team is pushed back
  for(const q of M.ps)if(q.team===p.team&&dist(q,car)<70){const dx=q.x-car.x,dy=q.y-car.y,d=Math.hypot(dx,dy)||1;q.x=car.x+dx/d*70;q.y=car.y+dy/d*70;q.cd=Math.max(q.cd,40)}
  car.down=0;car.cd=0;M.ball.owner=car;car.dec=25;
}
function endMatch(){
  M.state='end';M.over=true;const [a,b]=M.score;
  M.result={score:[a,b],ps:M.ps,goals:M.goals};
  const ov=$('ov');const T=M.teams;
  const won=a>b?T[0].name:b>a?T[1].name:null;
  ov.innerHTML=`<div class="box"><div class="eyebrow">Full time</div><div class="vs"><span>${esc(T[0].name)}</span><div class="score">${a} - ${b}</div><span>${esc(T[1].name)}</span></div>
  <p style="text-align:center">${won?esc(won)+' win':'It ends level'}</p>
  ${M.goals.length?`<ul>${M.goals.map(g=>`<li>${g.min}' ${esc(g.who)} (${esc(T[g.t].short)})</li>`).join('')}</ul>`:''}
  <button class="big primary" data-o="cont"><span><b>Continue</b></span><span class="chev">›</span></button>
  ${M.cfg.again?`<button class="big" data-o="again"><span><b>Play again</b></span><span class="chev">›</span></button>`:''}</div>`;
  ov.hidden=false;
}

function fitCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);const w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}return {w,h,dpr}}
function drawMatch(){
  const {w,h,dpr}=fitCanvas();const pad=34;const W=M.W,H=M.H;
  const rot=h>w*1.08;M.rot=rot;
  let s,ox,oy;
  if(!rot){s=Math.min(w/(W+pad*2),h/(H+pad*2));ox=(w-W*s)/2;oy=(h-H*s)/2}
  else{s=Math.min(w/(H+pad*2),h/(W+pad*2));ox=(w-H*s)/2;oy=(h-W*s)/2}
  const toS=(x,y)=>rot?[ox+y*s,oy+(W-x)*s]:[ox+x*s,oy+y*s];
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0b2414';ctx.fillRect(0,0,w,h);
  if(rot)ctx.setTransform(0,-dpr*s,dpr*s,0,dpr*ox,dpr*(oy+W*s));else ctx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);
  const stripes=10;for(let i=0;i<stripes;i++){ctx.fillStyle=i%2?'#2b8a46':'#2f9650';ctx.fillRect(i*W/stripes,0,W/stripes+0.5,H)}
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2.5;ctx.strokeRect(0,0,W,H);
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,H*0.14,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(W/2,H/2,3,0,7);ctx.fill();
  const bw=W*0.14,bh=Math.min(H*0.62,M.G*2.6),sw=W*0.05,sh=M.G*1.45;
  for(const side of [0,1]){const x0=side?W-bw:0;ctx.strokeRect(x0,H/2-bh/2,bw,bh);ctx.strokeRect(side?W-sw:0,H/2-sh/2,sw,sh);
    ctx.beginPath();ctx.arc(side?W-bw*0.72:bw*0.72,H/2,3,0,7);ctx.fill();
    const gx=side?W:-16;ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(gx,H/2-M.G/2,16,M.G);
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;for(let k=4;k<M.G;k+=8){ctx.beginPath();ctx.moveTo(gx,H/2-M.G/2+k);ctx.lineTo(gx+16,H/2-M.G/2+k);ctx.stroke()}
    ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(gx,H/2-M.G/2,16,M.G);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2.5;ctx.fillStyle='rgba(255,255,255,.85)'}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const b=M.ball;
  // shadows
  ctx.fillStyle='rgba(0,0,0,.25)';
  for(const p of M.ps){const [sx,sy]=toS(p.x,p.y);const r=Math.max(5.5,p.rad*s);ctx.beginPath();ctx.ellipse(sx+r*0.25,sy+r*0.45,r,r*0.6,0,0,7);ctx.fill()}
  // ctrl marker
  if(M.ctrl&&M.state!=='end'){const [cx,cy]=toS(M.ctrl.x,M.ctrl.y);const r=Math.max(5.5,M.ctrl.rad*s)+5+Math.sin(performance.now()/160)*1.5;ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke()}
  for(const p of M.ps){
    const [sx,sy]=toS(p.x,p.y);const r=Math.max(5.5,p.rad*s);const k=p.team.kit;
    const shirt=p.role==='GK'?(p.team.i===0?'#a3e635':'#f97316'):k.shirt;
    const lying=p.slide>0||p.down>0;const ang=M.rot?Math.atan2(-p.face.x,p.face.y):Math.atan2(p.face.y,p.face.x);
    if(p.slide>0){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=r*0.9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-Math.cos(ang)*r*2.6,sy-Math.sin(ang)*r*2.6);ctx.stroke()}
    ctx.fillStyle=shirt;ctx.beginPath();if(lying)ctx.ellipse(sx,sy,r*1.45,r*0.7,ang,0,7);else ctx.arc(sx,sy,r,0,7);ctx.fill();
    ctx.strokeStyle=p.role==='GK'?'#111':k.shorts;ctx.lineWidth=Math.max(2,r*0.28);ctx.stroke();
    if(r>=7){ctx.fillStyle=inkOn(shirt);ctx.font=`700 ${Math.round(r*1.05)}px "Saira Condensed",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.num,sx,sy+1)}
  }
  if(M.ctrl&&M.state!=='end'){const [cx,cy]=toS(M.ctrl.x,M.ctrl.y);const r=Math.max(5.5,M.ctrl.rad*s);
    ctx.font='600 12px Barlow,sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';const nm=lastName(M.ctrl.name);ctx.strokeText(nm,cx,cy-r-6);ctx.fillStyle='#ffd23f';ctx.fillText(nm,cx,cy-r-6);
    if(M.charge>0){const bw2=36;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(cx-bw2/2,cy+r+6,bw2,6);ctx.fillStyle=M.charge>=50?'#f87171':'#ffd23f';ctx.fillRect(cx-bw2/2,cy+r+6,bw2*M.charge/50,6)}}
  const [bx,by]=toS(b.x,b.y);const br=Math.max(3.5,4.5*s);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(bx+2,by+2,br,br*0.7,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,br,0,7);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=1.2;ctx.stroke();
  for(const q of M.pops){const [px,py]=toS(q.x,q.y);const yy=py-18-(55-q.t)*0.5;ctx.globalAlpha=Math.min(1,q.t/20);ctx.font='800 15px "Saira Condensed",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(q.text,px,yy);ctx.fillStyle=q.col;ctx.fillText(q.text,px,yy);ctx.globalAlpha=1}
  updateBtns();
  if(M.msgT>0||M.state==='kickoff'){const t=M.state==='kickoff'&&M.msgT<=0?(M.frame===0?'KICK OFF':''):M.msg;
    if(t){ctx.font=`800 ${Math.round(Math.min(w,h)*0.14)}px "Saira Condensed",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(t,w/2,h*0.4);ctx.fillStyle='#ffd23f';ctx.fillText(t,w/2,h*0.4)}}
  $('hS').textContent=M.score[0]+' - '+M.score[1];$('hT').textContent=Math.min(90,Math.floor(M.frame/M.total*90))+"'";
}

// ================= penalties =================
const PG={L:80,R:320,T:80,B:190},PBALL={x:200,y:272};
function startPens(cfg){
  P={cfg,kicks:0,me:[],opp:[],phase:'aim',rx:200,ry:130,pw:0,pd:1,t:0,kp:{x:200,y:PG.B-24},kt:{x:200,y:PG.B-24},shot:null,msg:'',paused:false,over:false,tap:null,chosen:false,crowd:[]};
  for(let i=0;i<260;i++)P.crowd.push([Math.random()*400,Math.random()*58,['#d9d4c7','#3b4f6b','#a33','#d1b04a','#555','#6c8'][i%6]]);
  M=null;openMatchUI('pens');newKick();
}
const myTurn=()=>P.kicks%2===0;
function newKick(){
  P.t=0;P.kp={x:200,y:PG.B-24};P.kt={x:200,y:PG.B-24};P.shot=null;P.tap=null;P.chosen=false;P.rx=200;P.ry=130;P.pw=0;P.pd=1;
  P.phase=myTurn()?'aim':'dive';clearEdges();
}
function pensWinner(){
  const a=P.me,b=P.opp,ga=a.filter(Boolean).length,gb=b.filter(Boolean).length;
  if(a.length<=5&&b.length<=5){if(ga+(5-a.length)<gb)return 'opp';if(gb+(5-b.length)<ga)return 'me';return null}
  if(a.length===b.length&&ga!==gb)return ga>gb?'me':'opp';return null;
}
function launchPen(tx,ty,power,shooterR,keeperR,aiKeeper){
  let ex=rand(-1,1)*(100-shooterR)*0.45,ey=rand(-1,1)*(100-shooterR)*0.3;
  if(power>0.85)ey-=(power-0.85)*260;
  const fx=tx+ex,fy=ty+ey;
  if(aiKeeper){const guess=Math.random()<0.3+(keeperR-60)/120;P.kt=guess?{x:fx+rand(-25,25),y:clamp(fy,PG.T+20,PG.B-20)}:pick([{x:PG.L+45,y:PG.B-40},{x:200,y:PG.B-30},{x:PG.R-45,y:PG.B-40},{x:PG.L+50,y:PG.T+35},{x:PG.R-50,y:PG.T+35}])}
  P.shot={fx,fy,power,frames:Math.round(42-power*20),keeperR};P.phase='fly';P.t=0;
}
function pensStep(){
  if(P.over)return;
  const tap=P.tap;P.tap=null;const v=screenVec();
  if(P.phase==='aim'){
    P.rx=clamp(P.rx+v.x*3.2,PG.L-40,PG.R+40);P.ry=clamp(P.ry+v.y*3.2,PG.T-40,PG.B-6);
    if(tap&&tap.y<PG.B+20){P.rx=clamp(tap.x,PG.L-40,PG.R+40);P.ry=clamp(tap.y,PG.T-40,PG.B-6);P.phase='power';P.pw=0;P.pd=1}
    else if(IN.shootDown){P.phase='power';P.pw=0;P.pd=1}
  }else if(P.phase==='power'){
    P.pw+=0.021*P.pd;if(P.pw>=1){P.pw=1;P.pd=-1}if(P.pw<=0){P.pw=0;P.pd=1}
    if(IN.shootDown||tap){const sh=P.cfg.my.shooters[Math.floor(P.kicks/2)%P.cfg.my.shooters.length];launchPen(P.rx,P.ry,Math.max(0.15,P.pw),sh.ovr,P.cfg.opp.gk.ovr,true)}
  }else if(P.phase==='dive'){
    P.t++;
    if(tap&&tap.y<PG.B+30){P.kt={x:clamp(tap.x,PG.L,PG.R),y:clamp(tap.y,PG.T+14,PG.B-14)};P.chosen=true}
    if(Math.hypot(v.x,v.y)>0.2){P.kt={x:clamp(P.kt.x+v.x*4,PG.L,PG.R),y:clamp(P.kt.y+v.y*4,PG.T+14,PG.B-14)};P.chosen=true}
    if(P.t>=110||(IN.shootDown&&P.chosen)){
      const sh=P.cfg.opp.shooters[Math.floor(P.kicks/2)%P.cfg.opp.shooters.length];
      const miss=Math.random()<0.07;
      const tx=miss?pick([PG.L-25,PG.R+25]):rand(PG.L+14,PG.R-14),ty=miss?rand(PG.T,PG.B):rand(PG.T+14,PG.B-12);
      launchPen(tx,ty,rand(0.45,0.8),sh.ovr+8,P.cfg.my.gk.ovr,false)}
  }else if(P.phase==='fly'){
    P.t++;const sh=P.shot;const k=Math.min(1,P.t/6);
    if(P.t>5){P.kp.x+=(P.kt.x-P.kp.x)*0.2;P.kp.y+=(P.kt.y-P.kp.y)*0.2}
    if(P.t>=sh.frames){
      let res;const reach=34+(sh.power<0.4?22:0)+(sh.keeperR-70)*0.5;
      if(sh.fx<PG.L||sh.fx>PG.R||sh.fy<PG.T)res=(Math.abs(sh.fx-PG.L)<5||Math.abs(sh.fx-PG.R)<5||Math.abs(sh.fy-PG.T)<5)?'POST!':'MISSED!';
      else if(Math.hypot(P.kp.x-sh.fx,(P.kp.y-sh.fy)*0.8)<reach)res='SAVED!';else res='GOAL!';
      (myTurn()?P.me:P.opp).push(res==='GOAL!');P.msg=res;P.phase='res';P.t=0;
    }
  }else if(P.phase==='res'){
    if(++P.t>85){P.kicks++;const w=pensWinner();if(w)return pensEnd(w);newKick()}
  }
  clearEdges();
}
function pensEnd(w){
  P.over=true;const ga=P.me.filter(Boolean).length,gb=P.opp.filter(Boolean).length;
  $('ov').innerHTML=`<div class="box"><div class="eyebrow">Shootout over</div><div class="vs"><span>${esc(P.cfg.my.name)}</span><div class="score">${ga} - ${gb}</div><span>${esc(P.cfg.opp.name)}</span></div><p style="text-align:center">${w==='me'?'You win the shootout!':'You lose the shootout.'}</p>
  <button class="big primary" data-o="again"><span><b>Play again</b></span><span class="chev">›</span></button><button class="big" data-o="cont"><span><b>Continue</b></span><span class="chev">›</span></button></div>`;$('ov').hidden=false;
}
let PV={s:1,ox:0,oy:0};
cv.addEventListener('pointerdown',e=>{if(mode!=='pens'||!P)return;if(G3.use){P.tap=pensTap3D(e.clientX,e.clientY);return}const r=cv.getBoundingClientRect();P.tap={x:(e.clientX-r.left-PV.ox)/PV.s,y:(e.clientY-r.top-PV.oy)/PV.s}});
function drawPens(){

  for(const [x,y,c] of P.crowd){ctx.fillStyle=c;ctx.fillRect(x,y+6,2.4,2.4)}

  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#2b8a46':'#2f9650';ctx.fillRect(0,72+i*28.5,400,28.5)}
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,PG.B);ctx.lineTo(400,PG.B);ctx.stroke();
  ctx.beginPath();ctx.moveTo(40,PG.B);ctx.lineTo(20,PG.B+70);ctx.lineTo(380,PG.B+70);ctx.lineTo(360,PG.B);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(PBALL.x,PBALL.y+4,6,2.5,0,0,7);ctx.fill();
  // net
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(PG.L,PG.T,PG.R-PG.L,PG.B-PG.T);
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=0.8;for(let x=PG.L;x<=PG.R;x+=10){ctx.beginPath();ctx.moveTo(x,PG.T);ctx.lineTo(x,PG.B);ctx.stroke()}for(let y=PG.T;y<=PG.B;y+=10){ctx.beginPath();ctx.moveTo(PG.L,y);ctx.lineTo(PG.R,y);ctx.stroke()}
  ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(PG.L,PG.B);ctx.lineTo(PG.L,PG.T);ctx.lineTo(PG.R,PG.T);ctx.lineTo(PG.R,PG.B);ctx.stroke();
  // keeper
  const kKit=myTurn()?P.cfg.opp.kit:P.cfg.my.kit;const kx=P.kp.x,ky=P.kp.y;const lean=clamp((P.kp.x-200)/120,-1,1);
  ctx.save();ctx.translate(kx,ky);ctx.rotate(lean*0.9);

  const bx=b.x-W/2,bz=b.y-H/2;let tgt,pos;
  if(!portrait){G3.cam.fov=w/h<1.5?44:38;tgt=new THREE.Vector3(clamp(bx,-W*0.4,W*0.4),0,bz*0.45);pos=new THREE.Vector3(tgt.x,175*k+45,tgt.z+H*0.32+215*k+40)}
  else{G3.cam.fov=58;tgt=new THREE.Vector3(clamp(bx+30*k,-W*0.4,W*0.46),0,bz*0.55);pos=new THREE.Vector3(tgt.x-300*k-50,230*k+55,tgt.z*0.85)}
  if(G3.snap){G3.ct.copy(tgt);G3.cp.copy(pos);G3.snap=false}else{const a=Math.min(1,0.07*M.speed);G3.ct.lerp(tgt,a);G3.cp.lerp(pos,a)}
  G3.cam.position.copy(G3.cp);G3.cam.lookAt(G3.ct);G3.cam.updateProjectionMatrix();
  M.ps.forEach((p,i)=>{const f=G3.figs[i];f.root.position.set(p.x-W/2,0,p.y-H/2);
    const ta=Math.atan2(p.face.x,p.face.y);let da=ta-f.root.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));f.root.rotation.y+=da*0.4;
    animFig(f,M.state==='play'||M.state==='goal'?Math.hypot(p.vx,p.vy):0,p.slide>0||p.down>0);
    f.legL.rotation.z=0;f.legR.rotation.z=0;
    if(p.sk>0){const prog=1-p.sk/p.skStart;
      if(p.skT==='spin')f.root.rotation.y=ta+prog*Math.PI*2;
      else if(p.skT==='step'){const s=Math.sin(prog*Math.PI*3);f.legL.rotation.z=Math.max(0,s)*0.9;f.legR.rotation.z=Math.min(0,s)*0.9;f.body.rotation.z=s*0.18}
      else if(p.skT==='flick'){f.legR.rotation.x=prog<0.5?1.6:-0.4;f.legL.rotation.x=0}}else f.body.rotation.z=0});
  const bz2=b.z||0;G3.ball.position.set(b.x-W/2,2.7+bz2,b.y-H/2);G3.ball.rotation.z-=b.vx*0.12;G3.ball.rotation.x+=b.vy*0.12;
  const c=M.ctrl&&M.state!=='end'&&M.cfg.control!=='none'?M.ctrl:null;G3.ring.visible=!!c;
  if(c){G3.ring.position.x=c.x-W/2;G3.ring.position.z=c.y-H/2;const s=1+Math.sin(performance.now()/160)*0.08;G3.ring.scale.set(s,1,s)}
  G3.r.render(G3.scene,G3.cam);
  // overlay
  const o=fitCanvas();ctx.setTransform(o.dpr,0,0,o.dpr,0,0);ctx.clearRect(0,0,o.w,o.h);
  if(c){const [cx,cy,vis]=proj(c.x-W/2,c.y-H/2,30,w,h);if(vis){
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(cx-6,cy-10);ctx.lineTo(cx+6,cy-10);ctx.lineTo(cx,cy-2);ctx.fill();
    ctx.font='700 13px Barlow,sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.65)';const nm=lastName(c.name);ctx.strokeText(nm,cx,cy-12);ctx.fillStyle='#ffd23f';ctx.fillText(nm,cx,cy-12);
    if(M.charge>0){const bw=40;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(cx-bw/2,cy+4,bw,6);ctx.fillStyle=M.charge>=50?'#f87171':'#ffd23f';ctx.fillRect(cx-bw/2,cy+4,bw*M.charge/50,6)}}}
  for(const q of M.pops){const [px,py,vis]=proj(q.x-W/2,q.y-H/2,28,w,h);if(!vis)continue;const yy=py-10-(55-q.t)*0.5;ctx.globalAlpha=Math.min(1,q.t/20);ctx.font='800 17px "Saira Condensed",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(q.text,px,yy);ctx.fillStyle=q.col;ctx.fillText(q.text,px,yy);ctx.globalAlpha=1}
  matchOverlayCommon(o.w,o.h);
}
// ---------- penalties in 3D ----------
// virtual goal (PG) → 3D: goal mouth on plane X=0, 73 units wide, 24.4 high; spot at X=-110
const PGW=73.2,PGH=24.4;
const pz=vx=>(vx-200)/120*(PGW/2), py3=vy=>(PG.B-vy)/(PG.B-PG.T)*PGH;
function build3DPens(){
  dispose3D();const T=THREE,scene=new T.Scene();G3.scene=scene;G3.kind='pens';
  scene.background=new T.Color('#0a1320');scene.fog=new T.Fog('#0a1320',600,1400);
  addLights(scene,-100,0,420);
  const W=1050,H=680,mg=70,G=PGW;const ground=new T.Mesh(new T.PlaneGeometry(W+mg*2,H+mg*2),M3('#ffffff',{map:pitchTex(W,H,G,mg)}));ground.rotation.x=-Math.PI/2;ground.position.x=-W/2;ground.receiveShadow=true;scene.add(ground);
  const apron=new T.Mesh(new T.PlaneGeometry(W+900,H+900),M3('#1d4a2a'));apron.rotation.x=-Math.PI/2;apron.position.set(-W/2,-0.3,0);scene.add(apron);
  stands(scene,-W/2,0,W,H,mg+10);
  // goal: G here is real width, crossbar PGH
  const post=M3('#ffffff');const cyl=(len,x,y,z,rx)=>{const m=new T.Mesh(new T.CylinderGeometry(1.2,1.2,len,10),post);m.position.set(x,y,z);if(rx)m.rotation.x=rx;m.castShadow=true;scene.add(m)};
  cyl(PGH,0,PGH/2,-PGW/2);cyl(PGH,0,PGH/2,PGW/2);cyl(PGW,0,PGH,0,Math.PI/2);
  const nm=new T.MeshBasicMaterial({map:netTex(),transparent:true,side:T.DoubleSide,depthWrite:false});
  const plane=(w,h,x,y,z,rx,ry,rw,rh)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),nm.clone());m.material.map=nm.map.clone();m.material.map.needsUpdate=true;m.material.map.repeat.set(rw,rh);m.position.set(x,y,z);m.rotation.set(rx,ry,0);scene.add(m)};
  plane(PGW,PGH,20,PGH/2,0,0,Math.PI/2,PGW/4,PGH/4);plane(20,PGW,10,PGH,0,-Math.PI/2,0,5,PGW/4);plane(20,PGH,10,PGH/2,-PGW/2,0,0,5,PGH/4);plane(20,PGH,10,PGH/2,PGW/2,0,0,5,PGH/4);
  const my=P.cfg.my.kit,op=P.cfg.opp.kit;
  G3.keepers=[makeFig('#a3e635','#1b1b1b','gk-me'),makeFig('#f97316','#1b1b1b','gk-opp')];
  G3.shooters=[makeFig(my.shirt,my.shorts,'sh-me'),makeFig(op.shirt,op.shorts,'sh-opp')];
  for(const f of [...G3.keepers,...G3.shooters])scene.add(f.root);
  const g=shared();G3.ball=new T.Mesh(g.ball,M3('#ffffff',{map:ballTex()}));G3.ball.castShadow=true;scene.add(G3.ball);
  const ringAt=c=>{const m=new T.Mesh(new T.RingGeometry(2.6,3.8,28),new T.MeshBasicMaterial({color:c,side:T.DoubleSide,depthTest:false}));m.rotation.y=Math.PI/2;m.renderOrder=5;scene.add(m);return m};
  G3.ret=ringAt(0xffd23f);G3.dive=ringAt(0xa3e635);
  G3.cam=new T.PerspectiveCamera(42,1,2,3000);G3.ray=new T.Raycaster();
}
function pensTap3D(cx,cy){
  const r=glc.getBoundingClientRect();const v=new THREE.Vector2((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);
  G3.ray.setFromCamera(v,G3.cam);const o=G3.ray.ray.origin,d=G3.ray.ray.direction;if(Math.abs(d.x)<1e-4)return null;const t=-o.x/d.x;if(t<0)return null;
  const p=o.clone().addScaledVector(d,t);return {x:200+p.z/(PGW/2)*120,y:PG.B-p.y/PGH*(PG.B-PG.T)};
}
function drawPens3D(){
  const {w,h}=size3D();const cam=G3.cam;
  const hf=2*Math.atan((PGW/2+22)/178);cam.fov=Math.max(40,2*Math.atan(Math.tan(hf/2)/(w/h))*180/Math.PI);
  cam.position.set(-182,30,4);cam.lookAt(0,9,0);cam.updateProjectionMatrix();
  const mine=myTurn();const kp=G3.keepers[mine?1:0],kOther=G3.keepers[mine?0:1];kOther.root.visible=false;kp.root.visible=true;
  const kz=pz(P.kp.x),ky=Math.max(0,py3(P.kp.y)-py3(PG.B-24));
  kp.root.position.set(-3,ky*0.8,kz);kp.root.rotation.y=-Math.PI/2;
  const lean=clamp(kz/(PGW/2),-1,1);kp.body.rotation.z=lean*1.15;kp.body.rotation.x=0;
  const up=P.phase==='fly'||P.phase==='res';kp.armL.rotation.z=up?2.7:0.6;kp.armR.rotation.z=up?-2.7:-0.6;kp.armL.rotation.x=kp.armR.rotation.x=0;
  kp.legL.rotation.x=kp.legR.rotation.x=0;kp.legL.rotation.z=up?0.25:0.1;kp.legR.rotation.z=up?-0.25:-0.1;
  const sh=G3.shooters[mine?0:1],so=G3.shooters[mine?1:0];so.root.visible=false;sh.root.visible=true;
  let run=0;if(P.phase==='fly'||P.phase==='res')run=Math.min(1,(P.phase==='res'?99:P.t)/6);
  sh.root.position.set(-126+run*13,0,-20+run*16);sh.root.rotation.y=Math.PI/2;sh.legR.rotation.x=run>0&&run<1?-1.2:run>=1&&P.phase==='fly'&&P.t<12?0.9:0;sh.legL.rotation.x=0;
  // ball
  let bp=new THREE.Vector3(-110,2.7,0);
  if(P.shot&&(P.phase==='fly'||P.phase==='res')){const s=P.shot,k=P.phase==='res'?1:Math.min(1,P.t/s.frames);
    const tz=pz(s.fx),ty=Math.max(2.7,py3(s.fy));bp.set(-110+110*k,2.7+(ty-2.7)*k+Math.sin(k*Math.PI)*6,tz*k);
    if(P.phase==='res'){const extra=Math.min(1,P.t/20);if(P.msg==='GOAL!')bp.x=extra*16;else if(P.msg==='SAVED!'){bp.x=-extra*30;bp.z+=Math.sign(tz||1)*extra*20;bp.y=Math.max(2.7,bp.y-extra*15)}else bp.x=extra*40}
    G3.ball.rotation.z-=0.3}
  G3.ball.position.copy(bp);
  G3.ret.visible=P.phase==='aim'||P.phase==='power';G3.ret.position.set(-1,py3(P.ry),pz(P.rx));
  G3.dive.visible=P.phase==='dive'&&P.chosen;G3.dive.position.set(-1,py3(P.kt.y),pz(P.kt.x));
  G3.r.render(G3.scene,cam);
  // overlay
  const o=fitCanvas();ctx.setTransform(o.dpr,0,0,o.dpr,0,0);ctx.clearRect(0,0,o.w,o.h);pensOverlay(o.w,o.h);
}

// ================= loop =================
function loop(ts){
  if(!running)return;requestAnimationFrame(loop);
  const dt=Math.min(0.1,(ts-lastTs)/1000);lastTs=ts;acc+=dt;let n=0;
  while(acc>=1/60&&n<6){acc-=1/60;n++;
    if(mode==='match'&&!M.paused&&!M.over){for(let k=0;k<M.speed&&!M.over;k++)step()}
    else if(mode==='pens'&&!P.paused)pensStep();}
  if(mode==='match')(G3.use?drawMatch3D:drawMatch)();else if(mode==='pens')(G3.use?drawPens3D:drawPens)();
}
